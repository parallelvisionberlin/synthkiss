<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fcfaf8">
<meta name="description" content="Synthkiss creative workspace.">
<link rel="icon" href="assets/kiss.svg" type="image/svg+xml">
<title>Synthkiss — Home</title>
<style>
:root{color-scheme:light;--paper:#fcfaf8;--sidebar:#f8f5f2;--ink:#241f1d;--line:#e8e2dd;--selected:#eee9e4;--rail:220px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #716258;outline-offset:5px}
.skip{position:fixed;top:12px;left:240px;z-index:10;transform:translateY(-200%);padding:12px;background:var(--paper)}
.skip:focus{transform:none}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--sidebar);border-right:1px solid var(--line);z-index:3}
.brand{display:inline-flex;margin:32px 28px;padding:4px 0}
.brand img{width:44px;height:30px;display:block}
nav{margin-top:90px}
.nav-link{min-height:56px;display:flex;align-items:center;gap:20px;padding:14px 28px;font-size:15px;white-space:nowrap;transition:background .15s}
.nav-link:hover{background:#f1ede9}
.nav-link[aria-current="page"]{background:var(--selected);font-weight:600}
.nav-link svg{width:21px;height:21px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.workspace{margin-left:var(--rail);min-height:100svh;padding:142px 40px 60px}
.identity{text-align:center}
.identity img{display:block;width:72px;height:44px;margin:0 auto 23px}
h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(36px,4.2vw,62px);font-weight:400;letter-spacing:.025em;line-height:1.1}
.templates{min-height:48vh;margin-top:70px}
.tool-view{max-width:1000px;margin:0 auto}
.tool-view h1{font-size:40px;letter-spacing:0}
.tool-view p{font-size:14px;color:#796f68;margin-top:18px;line-height:1.6}
.menu-toggle{display:none;border:0;background:transparent;padding:12px;position:fixed;top:16px;left:16px;z-index:4;border-radius:4px}
.menu-toggle svg{display:block;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.4}
.scrim{position:fixed;inset:0;background:#241f1d26;border:0;z-index:2}
@media(max-width:680px){.sidebar{transform:translateX(-100%);transition:transform .2s ease}.sidebar.is-open{transform:translateX(0)}.workspace{margin-left:0;padding:132px 24px 40px}.menu-toggle{display:block}.sidebar .brand{margin-top:77px}nav{margin-top:36px}.identity img{width:62px;height:38px;margin-bottom:19px}.identity h1{font-size:clamp(32px,8.8vw,48px)}.tool-view h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#workspace">Skip to workspace</a>
<button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
<button class="scrim" aria-label="Close menu" hidden tabindex="-1"></button>
<aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
<a class="brand" href="#home" aria-label="Synthkiss home"><img src="assets/kiss.svg" alt="" width="44" height="30"></a>
<nav aria-label="Main navigation">
<a class="nav-link" href="#home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z"/></svg><span>Home</span></a>
<a class="nav-link" href="#image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg><span>Image</span></a>
<a class="nav-link" href="#image-to-video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m10 8 6 4-6 4Z"/></svg><span>Image to Video</span></a>
<a class="nav-link" href="#video-to-video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="14" height="14" rx="1"/><path d="m16 10 6-4v12l-6-4M7 9l5 3-5 3Z"/></svg><span>Video to Video</span></a>
<a class="nav-link" href="#extend-video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2" width="18" height="20" rx="1"/><path d="M7 2v20M17 2v20M3 7h4m10 0h4M3 12h4m10 0h4M3 17h4m10 0h4M10 12h4m-2-2 2 2-2 2"/></svg><span>Extend Video</span></a>
</nav>
</aside>
<main class="workspace" id="workspace" tabindex="-1">
<section id="home-view" aria-label="Synthkiss home">
<div class="identity"><img src="assets/kiss.svg" alt="" width="72" height="44"><h1>SYNTHKISS</h1></div>
<div class="templates" id="templates" aria-label="Template workspace"></div>
</section>
<section class="tool-view" id="tool-view" hidden aria-labelledby="tool-title"><h1 id="tool-title"></h1><p>Generation is not available yet.</p></section>
</main>
<script>
const sidebar=document.getElementById('sidebar');
const toggle=document.querySelector('.menu-toggle');
const scrim=document.querySelector('.scrim');
const links=[...document.querySelectorAll('.nav-link')];
const mobile=matchMedia('(max-width:680px)');
function menu(open){sidebar.classList.toggle('is-open',open);toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close menu':'Open menu');scrim.hidden=!open;sidebar.inert=mobile.matches&&!open;}
function route(){const active=links.find(link=>link.hash===location.hash)||links[0];for(const link of links){if(link===active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');}const home=active.hash==='#home';document.getElementById('home-view').hidden=!home;document.getElementById('tool-view').hidden=home;document.getElementById('tool-title').textContent=active.textContent.trim();document.title='Synthkiss — '+active.textContent.trim();menu(false);}
toggle.addEventListener('click',()=>menu(toggle.getAttribute('aria-expanded')!=='true'));
scrim.addEventListener('click',()=>{menu(false);toggle.focus()});
sidebar.addEventListener('click',event=>{if(event.target.closest('a')){menu(false);document.getElementById('workspace').focus({preventScroll:true});}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&toggle.getAttribute('aria-expanded')==='true'){menu(false);toggle.focus();}});
mobile.addEventListener('change',()=>menu(false));
addEventListener('hashchange',route);route();
</script>
</body>
</html>
